<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data: https:; font-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>{{PAGE_TITLE}}</title>
<style>
:root{--ink:#1d1d1f;--accent:#756b61;--muted:#77716b;--rule:#d9d6d1;--paper:#f7f7f5;--panel:#fff;--side:#eeeeeb;--hl:#efeee9}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif;line-height:1.9;font-size:16px}
.layout{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh;max-width:1600px;margin:0 auto}.toc{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);border-right:1px solid var(--rule);padding:2.2rem 1.6rem;font-size:.86rem}.toc h2{font-size:.9rem;letter-spacing:.14em;margin:0 0 1.25rem;color:var(--accent);border:0;padding:0}.toc ul{list-style:none;margin:0;padding:0}.toc li{margin:.3rem 0}.toc a{color:var(--ink);text-decoration:none;display:block;padding:.18rem .4rem;border-radius:6px}.toc a:hover{background:rgba(255,255,255,.68);color:var(--accent)}.toc ul ul{padding-left:.8rem}.toc .l2{font-size:.84rem;color:var(--muted)}.toc .l3{padding-left:.65rem;font-size:.8rem;color:var(--muted)}
.page{width:100%;max-width:980px;margin:0 auto;padding:3.2rem clamp(2rem,4vw,4.5rem) 6rem;min-width:0}.title-block{padding-bottom:1.8rem;margin-bottom:2rem;border-bottom:1px solid var(--rule)}h1{font-size:2rem;line-height:1.45;margin:0 0 .35rem;letter-spacing:.01em;overflow-wrap:anywhere}.author{font-size:1rem;color:var(--muted);margin-top:1rem}.source{font-size:.88rem;color:var(--muted);font-style:italic;margin-top:.35rem;overflow-wrap:anywhere;word-break:break-word}
.long-abstract,.guide,.orig{background:var(--panel);border:1px solid var(--rule);border-radius:10px}.long-abstract{padding:1.25rem 1.5rem;margin:2rem 0 2.8rem;font-size:.95rem}.long-abstract h2,.guide h2{font-size:1.05rem;margin:0 0 .7rem;color:var(--accent);border:0;padding:0}.long-abstract h3,.guide h3{font-size:.96rem;margin:1rem 0 .3rem;color:var(--accent)}.long-abstract p,.guide p{margin:.35rem 0}.guide{padding:1.25rem 1.5rem;margin:1.8rem 0;font-size:.95rem}.guide-tag{display:inline-block;font:normal .68rem/1.4 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.08em;color:var(--muted);border:1px solid var(--rule);border-radius:99px;padding:.12rem .5rem;margin-left:.5rem;vertical-align:middle}
h2{font-size:1.4rem;margin:3.2rem 0 1rem;padding:0 0 .45rem .8rem;border-bottom:1px solid var(--rule);border-left:3px solid var(--accent);scroll-margin-top:1rem}h3{font-size:1.1rem;margin:1.9rem 0 .8rem}h4{font-size:1rem;margin:1.45rem 0 .6rem}p{margin:.85rem 0;text-align:justify}p,li,td{overflow-wrap:anywhere}sup.fn a{font-size:.75em;color:var(--accent);text-decoration:none;font-family:Georgia,serif}.orig{padding:1rem 1.35rem;margin:1.25rem 0;font:normal .98rem/1.9 "KaiTi","STKaiti","Kaiti SC",serif}ul,ol{padding-left:1.6rem}li{margin:.4rem 0}table{border-collapse:collapse;margin:1.3rem 0;width:100%;font-size:.92rem;background:var(--panel);border:1px solid var(--rule);display:block;overflow-x:auto}th,td{border:1px solid var(--rule);padding:.5rem .65rem;text-align:left;vertical-align:top}th{background:var(--hl);font-weight:600}.fnnote{font-size:.85rem;list-style:none;padding-left:0}.fnnote li{margin:.75rem 0;padding-left:2.4rem;text-indent:-2.4rem}#footnotes{margin-top:4rem;border-top:1px solid var(--ink);padding-top:1.5rem;font-size:.88rem;color:#363432}#footnotes h2{font-size:1.12rem;border:0;padding-left:0}.num{color:var(--accent);font-family:Georgia,serif;font-size:.9em}.small,.biblio{font-size:.88rem;color:var(--muted)}.biblio p{margin:.6rem 0;padding-left:1.6rem;text-indent:-1.6rem}hr{border:0;border-top:1px solid var(--rule);margin:2rem 0}
@media(max-width:900px){.layout{display:block}.toc{display:none}.page{padding:2rem 1.15rem 4rem}.page h1{font-size:1.6rem}.title-block{margin-bottom:1.4rem}.guide,.long-abstract{padding:1rem}.biblio p{padding-left:0;text-indent:0}}@media print{.toc{display:none}.layout{display:block}body{background:#fff}.page{max-width:100%;padding:0}}
</style></head><body><div class="layout"><aside class="toc"><h2>目 录</h2>{{TOC}}</aside><main class="page"><header class="title-block"><h1>{{TITLE_CN}}</h1><div class="author">{{AUTHOR}}</div><div class="source">{{SOURCE}}</div></header>{{GUIDE}}{{BODY}}<hr><p class="small">机器翻译工作稿，未经人工终校。</p></main></div></body></html>
